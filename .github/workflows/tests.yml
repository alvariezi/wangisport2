name: Run Tests

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Tambahkan bagian services ini agar MySQL aktif di GitHub Actions
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wangisport2
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # (Langkah-langkah setup PHP, composer, dll sesuaikan dengan project Anda)

      - name: Run Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wangisport2
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force